name: Build sensitive APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: 固定 debug 签名
        run: |
          if [ -n "${{ secrets.DSH_KEYSTORE_B64 }}" ]; then
            mkdir -p "$HOME/.android"
            echo "${{ secrets.DSH_KEYSTORE_B64 }}" | base64 -d > "$HOME/.android/debug.keystore"
            rm -f app/android/key.properties app/android/dsh-release.p12
            echo signed-with-stable-debug-key
          else
            echo no-signing-secret
          fi
      - run: bash tools/sensitive-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-sensitive-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
