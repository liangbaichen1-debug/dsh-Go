name: Build sensitive APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: 固定签名（有 secret 就用，以后覆盖安装不丢数据）
        run: |
          if [ -n "${{ secrets.DSH_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.DSH_KEYSTORE_B64 }}" | base64 -d > app/android/dsh-release.p12
            {
              echo "storeFile=dsh-release.p12"
              echo "storeType=PKCS12"
              echo "storePassword=${{ secrets.DSH_STORE_PASSWORD }}"
              echo "keyAlias=dsh"
              echo "keyPassword=${{ secrets.DSH_KEY_PASSWORD }}"
            } > app/android/key.properties
            echo signed-with-repo-key
          else
            echo no-signing-secret
          fi
      - run: bash tools/sensitive-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-sensitive-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
